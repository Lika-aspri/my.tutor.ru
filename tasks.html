<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои задания | MyTutor</title>
    <!-- Подключаем общие стили из корневой папки -->
    <link rel="stylesheet" href="../style.css">
    
    <style>
        /* Стили для карточек */
        .task-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 0;
        }

        .lesson-group {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid #E5E7EB;
        }

        .lesson-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px dashed #E5E7EB;
        }

        /* Стили для теории */
        .theory-card {
            background: #F3F4F6;
            border-left: 5px solid var(--primary);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }
        .theory-title { font-size: 18px; font-weight: 700; margin-bottom: 10px; color: #111827; }
        .theory-text { font-size: 16px; line-height: 1.6; color: #374151; white-space: pre-wrap; }
        .theory-image { max-width: 100%; border-radius: 8px; margin-top: 15px; border: 1px solid #ddd; }

        /* Стили для практики */
        .task-widget {
            padding: 20px;
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            margin-bottom: 25px;
            transition: 0.3s;
        }
        .task-widget.correct { border-color: #10B981; background: #ECFDF5; }
        .task-widget.incorrect { border-color: #EF4444; background: #FEF2F2; }
        
        .task-question { font-size: 18px; font-weight: 600; margin-bottom: 15px; white-space: pre-wrap; color: #111827; }
        
        .task-input {
            width: 100%; padding: 12px 16px; font-size: 16px;
            border: 2px solid #D1D5DB; border-radius: 8px;
            margin-bottom: 12px; outline: none; transition: 0.2s;
        }
        .task-input:focus { border-color: var(--primary); }

        .task-btn {
            background: var(--primary); color: white; padding: 10px 24px;
            border: none; border-radius: 8px; font-weight: 600; cursor: pointer;
            font-size: 15px; transition: 0.2s;
        }
        .task-btn:hover { background: var(--primary-hover); }

        .task-options { display: grid; gap: 12px; }
        .option-btn {
            padding: 14px 20px; font-size: 16px; background: #F9FAFB;
            border: 2px solid #E5E7EB; border-radius: 8px; cursor: pointer;
            text-align: left; transition: 0.2s; color: #374151;
        }
        .option-btn:hover { border-color: var(--primary); background: white; }

        .task-feedback {
            margin-top: 15px; font-weight: 700; font-size: 15px; display: none;
        }
        .task-widget.correct .task-feedback { display: block; color: #065F46; }
        .task-widget.incorrect .task-feedback { display: block; color: #991B1B; }

        .empty-tasks {
            text-align: center; padding: 60px; background: white;
            border-radius: 16px; border: 1px dashed #D1D5DB; color: #6B7280;
        }
    </style>
</head>
<body class="dashboard-body">

    <!-- Боковое меню (как в кабинете ученика) -->
    <aside class="sidebar">
        <div class="sidebar-logo">MyTutor 🎒</div>
        <nav class="sidebar-nav">
            <a href="../student/dashboard.html">🏠 Мой кабинет</a>
            <a href="tasks.html" class="active">🃏 Мои задания</a>
        </nav>
        <button onclick="logout()" class="btn-logout">Выйти</button>
    </aside>

    <!-- Основной контент -->
    <main class="main-content">
        <header class="top-header" style="margin-bottom: 20px;">
            <h1>Мои задания 🚀</h1>
            <p style="color: #6B7280;">Выполняй карточки, чтобы прокачать свои навыки!</p>
        </header>

        <!-- Сюда скрипт будет вставлять уроки и карточки -->
        <div id="tasksContainer" class="task-container">
            <div class="empty-tasks">
                <h3>Загрузка заданий...</h3>
            </div>
        </div>
    </main>

    <!-- Подключаем базу данных и скрипты -->
    <script src="../auth.js"></script>
    <script src="tasks-data.js"></script>
    <script src="tasks.js"></script>
    
    <!-- Кнопка выхода -->
    <script>
        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = '../index.html';
        }
    </script>
</body>
</html>

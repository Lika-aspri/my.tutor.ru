<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой профиль | MyTutor</title>
    <link rel="stylesheet" href="../style.css">
    
    <style>
        .profile-header {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 40px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }
        .avatar-big {
            width: 100px;
            height: 100px;
            background: #E0E7FF;
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: 800;
        }
        .profile-info h1 { font-size: 28px; margin-bottom: 5px; }
        .profile-info p { color: var(--text-muted); font-size: 16px; }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
            font-size: 16px;
        }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: var(--text-muted); }
        .info-value { font-weight: 600; color: var(--text-main); }
    </style>
</head>
<body class="dashboard-body">

    <!-- Боковое меню -->
    <aside class="sidebar">
        <div class="sidebar-logo">MyTutor 🎒</div>
        <nav class="sidebar-nav">
            <a href="dashboard.html">🏠 Мой кабинет</a>
            <a href="../tasks/tasks.html">🃏 Мои задания</a>
            <a href="profile.html" class="active">👤 Мой профиль</a>
        </nav>
        <button onclick="logout()" class="btn-logout">Выйти</button>
    </aside>

    <!-- Основной контент -->
    <main class="main-content">
        
        <header class="top-header">
            <h1>Личный профиль</h1>
        </header>

        <!-- Шапка профиля -->
        <div class="profile-header">
            <div class="avatar-big" id="avatarLetter">?</div>
            <div class="profile-info">
                <h1 id="profileName">Загрузка...</h1>
                <p>Ученик платформы MyTutor</p>
            </div>
        </div>

        <!-- Данные -->
        <div class="card">
            <h2 style="margin-bottom: 20px; font-size: 20px;">Мои данные</h2>
            
            <div class="info-row">
                <span class="info-label">Логин для входа</span>
                <span class="info-value" id="profileLogin">-</span>
            </div>
            
            <div class="info-row">
                <span class="info-label">Предмет / Уровень</span>
                <span class="info-value" id="profileSubject">-</span>
            </div>
            
            <div class="info-row">
                <span class="info-label">Статус</span>
                <span class="info-value" style="color: #10B981;">Активен</span>
            </div>
        </div>

    </main>

    <script src="../auth.js"></script>
    <script>
        window.onload = function() {
            // Проверка авторизации
            const user = JSON.parse(localStorage.getItem('currentUser'));
            if (!user || user.role !== 'student') {
                window.location.href = '../index.html';
                return;
            }

            // Заполняем данные
            document.getElementById('profileName').innerText = user.name;
            document.getElementById('profileLogin').innerText = user.login;
            document.getElementById('profileSubject').innerText = user.subject;
            
            // Делаем красивую букву-аватар
            document.getElementById('avatarLetter').innerText = user.name.charAt(0).toUpperCase();
        };

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = '../index.html';
        }
    </script>
</body>
</html>
